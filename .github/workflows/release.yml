name: release-artifacts

# Reusable: called by release-please.yml in the same run a release is created
# (a bot-created release can't trigger `on: release`, so we call this instead).
# Also dispatchable manually to (re)build artifacts for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build artifacts for (e.g. tikl-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: windows-2025, name: windows-x86_64 }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --group packaging
      - name: Build binary
        run: uv run --group packaging pyinstaller --onefile --name tikl --collect-all scapy packaging/entrypoint.py
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/tikl.exe "out/tikl-${{ matrix.name }}.exe"
          else
            cp dist/tikl "out/tikl-${{ matrix.name }}"
          fi
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber --repo "${{ github.repository }}"

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Derive semver image tag
        id: ver
        run: |
          v="${{ inputs.tag }}"; v="${v#tikl-}"; v="${v#v}"
          echo "semver=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tikl:latest
            ghcr.io/${{ github.repository_owner }}/tikl:${{ steps.ver.outputs.semver }}
