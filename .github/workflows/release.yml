name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binary (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: windows-2025, name: windows-x86_64 }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group packaging
      - name: Build binary
        run: uv run --group packaging pyinstaller --onefile --name tikl --collect-all scapy packaging/entrypoint.py
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/tikl.exe "out/tikl-${{ matrix.name }}.exe"
          else
            cp dist/tikl "out/tikl-${{ matrix.name }}"
          fi
      - name: Attach to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: out/*

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tikl:latest
            ghcr.io/${{ github.repository_owner }}/tikl:${{ github.event.release.tag_name }}
