[project]
name = "tikl"
version = "0.3.0"
description = "Recovery CLI for MikroTik/RouterOS routers over MAC-Telnet (L2, no IP) or SSH."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Joris de Josselin de Jong", email = "j.j.dejosselindejong@gmail.com" }]
keywords = ["mikrotik", "routeros", "mac-telnet", "ec-srp5", "recovery", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = [
    "click==8.5.0",
    "scapy==2.7.0",
    "ecdsa==0.19.2",
    "paramiko==5.0.0",
]

[project.urls]
Homepage = "https://github.com/jorisdejosselin/tikl"
Repository = "https://github.com/jorisdejosselin/tikl"

[project.scripts]
tikl = "tikl.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
]
packaging = [
    "pyinstaller==6.22.2",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tikl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# curve.py is adapted third-party EC-SRP5 math (MarginResearch, MIT); kept
# faithful to upstream rather than restyled.
"src/tikl/mac/curve.py" = ["E741", "B007"]

[tool.mypy]
python_version = "3.11"
packages = ["tikl"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scapy.*", "ecdsa.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["msvcrt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["paramiko.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hw: integration test requiring real RouterOS hardware or a CHR VM (skipped in CI)",
]
